# ==============================================================================
# InterAula - Orquestación de Contenedores de Producción con Docker Compose
# Estructura separada: ./frontend y ./backend
# ==============================================================================

services:
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: interaula-ml
    restart: unless-stopped
    environment:
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    networks:
      - interaula-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interaula-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=${DOCKER_CORS_ORIGIN:-http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:8080,http://localhost:3000,http://localhost:5173}
      - SUPABASE_URL=${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - ML_SERVICE_URL=http://ml:8000
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
    volumes:
      - interaula-backend-data:/app/data
    networks:
      - interaula-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
    container_name: interaula-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - interaula-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  interaula-network:
    driver: bridge

volumes:
  interaula-backend-data:
