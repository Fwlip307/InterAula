server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para optimizar ancho de banda
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Soporte para enrutamiento SPA (React Router)
    # Redirige rutas inexistentes a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend de InterAula
    # Permite al navegador resolver peticiones /api/ mediante el mismo origen HTTP
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Caché optimizada para assets inmutables con hash
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Desactivar caché para index.html para evitar stale versions en despliegues
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Bloquear acceso a archivos y carpetas ocultas
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
